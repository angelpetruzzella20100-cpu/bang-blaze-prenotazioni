<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BANG SUPERMARKET • BLAZE 140K</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { margin:0; overflow:hidden; background:#050505; }
    #ui { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
    .product { transition: all 0.4s; }
    .product:hover { transform: scale(1.1) rotate(3deg); }
  </style>
</head>
<body>
  <div id="three-container"></div>

  <div id="ui" class="p-6 text-white">
    <div class="flex justify-between text-3xl font-black text-orange-500 mb-8">
      <div>BANG SUPERMARKET</div>
      <div onclick="toggleCart()" class="cursor-pointer flex items-center gap-2">🛒 <span id="cart-count">0</span></div>
    </div>

    <div id="products" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>

    <!-- CARRELLO -->
    <div id="cart-panel" class="hidden fixed bottom-6 right-6 bg-zinc-900 border-2 border-orange-500 rounded-3xl p-8 w-96 max-h-[80vh] overflow-auto">
      <h2 class="text-2xl font-bold mb-6">IL TUO CARRELLO</h2>
      <div id="cart-items" class="space-y-4"></div>
      <button onclick="checkout()" class="mt-8 w-full bg-gradient-to-r from-orange-500 to-red-500 py-6 rounded-2xl text-xl font-bold">GENERA SCONTRINO E PRENOTA</button>
    </div>
  </div>

<script>
// ==================== THREE.JS ====================
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 8, 20);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.getElementById('three-container').appendChild(renderer.domElement);

// Luci
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const light = new THREE.PointLight(0xff5500, 1.5);
light.position.set(10, 15, 10);
scene.add(light);

// ==================== I 12 GUSTI ====================
const flavors = [
  {id:1, name:"🍉 Watermelon Ice Cream + 🍓 Strawberry Lychee + 🍭 Gummy Bears", color:0xff0088},
  {id:2, name:"🍑 Peach Blueberry Ice Cream + 🍉 Watermelon Strawberry + 🍋 Lemon", color:0xffaa00},
  {id:3, name:"🍇 Grape Strawberry Ice Cream + 🥭 Mango Mixed Berries", color:0x8800ff},
  {id:4, name:"🫐 Blueberry Ice + 🍑🥭 Peach Mango + 🍉 Watermelon Love 66", color:0x0088ff},
  {id:5, name:"🫐 Blueberry Raspberry + 🥝 Kiwi Passion Fruit + 🥥 Guava Pineapple Coconut", color:0x00ff88},
  {id:6, name:"🍓 Strawberry Watermelon Blueberry + 🍑 Peach Blackcurrant + 🍍 Pineapple", color:0xff0088},
  {id:7, name:"🍓🥝 Strawberry Kiwi Watermelon + 🫐 Blueberry Cherry Chewing Gum", color:0xff8800},
  {id:8, name:"🐉 Black Dragon Ice + 🍓 Strawberry Mamba + 🍇 Strawberry Grapes", color:0x6600aa},
  {id:9, name:"🥭🍑 Mango Peach + 🫐 Blueberry Red Bull + 🍎🍇 Apple Grape", color:0xffaa00},
  {id:10, name:"🥭 Triple Mango + 🍓 Raspberry + 🍋 Lemon Blueberry", color:0xff5500},
  {id:11, name:"🍋 Lemon Lime Aloe + 🍈 Mango Melon Watermelon + 🐉 Dragon Fruit", color:0x00ffcc},
  {id:12, name:"🍌 Banana Ice Cream + 🍓 Strawberry Ice Cream + 🍉 Watermelon Berries", color:0xffee00}
];

let cart = [];

// Crea scatola 3D
function createBox(flavor) {
  const geo = new THREE.BoxGeometry(4, 5, 2);
  const mat = new THREE.MeshPhongMaterial({color: flavor.color});
  const box = new THREE.Mesh(geo, mat);
  box.position.y = 2;
  box.userData = flavor;
  scene.add(box);
  return box;
}

// Render prodotti UI
function renderProducts() {
  const container = document.getElementById('products');
  container.innerHTML = flavors.map(f => `
    <div onclick="addToCart(${f.id})" class="product bg-zinc-900 rounded-3xl p-6 cursor-pointer border border-zinc-700 hover:border-orange-500">
      <div class="text-7xl mb-6">${f.name.split(' ')[0]}</div>
      <h3 class="font-bold text-lg leading-tight">${f.name}</h3>
      <p class="text-orange-400 text-sm mt-2">2 disponibili • €7.99</p>
    </div>
  `).join('');
}

function addToCart(id) {
  const flavor = flavors.find(f => f.id === id);
  cart.push(flavor);
  document.getElementById('cart-count').textContent = cart.length;
  renderCart();
}

function renderCart() {
  const items = document.getElementById('cart-items');
  items.innerHTML = cart.map((item, i) => `
    <div class="flex justify-between items-center bg-zinc-800 p-4 rounded-2xl">
      <span>${item.name}</span>
      <span class="text-orange-400">€7.99</span>
    </div>
  `).join('');
}

function toggleCart() {
  document.getElementById('cart-panel').classList.toggle('hidden');
}

function checkout() {
  let receipt = "══════════════════════════════\n";
  receipt += "     BANG SUPERMARKET\n";
  receipt += "   SCONTRINO PRENOTAZIONE\n";
  receipt += "══════════════════════════════\n\n";

  cart.forEach(item => {
    receipt += `${item.name}\n`;
    receipt += `Codice: BB-${Math.floor(100000 + Math.random()*900000)}\n`;
    receipt += `Prezzo: €7.99\n\n`;
  });

  receipt += `TOTALE: €${(cart.length * 7.99).toFixed(2)}\n`;
  receipt += "Grazie per aver prenotato da Bang Blaze!\n";
  receipt += `IG: @angel.petrux_`;

  alert(receipt);

  // Notifica Instagram
  const msg = `Nuove prenotazioni Bang Blaze!\n\n${cart.map(c => c.name).join('\n')}`;
  window.open(`https://www.instagram.com/angel.petrux_/?text=${encodeURIComponent(msg)}`, '_blank');

  cart = [];
  toggleCart();
}

renderProducts();

// Animazione Three.js semplice
function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
